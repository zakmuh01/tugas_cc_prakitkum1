<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammad Zaky</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      color: #1e293b;
    }
    main {
      padding: 48px 56px;
      max-width: 90%;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { margin: 0; color: #64748b; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Muhammad Zaky</h1>
    <p>Selamat datang di halaman HTML saya.</p>
  </main>
</body>
</html>
